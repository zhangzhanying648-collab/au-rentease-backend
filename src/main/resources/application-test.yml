spring:
  datasource:
    # 🌟 核心修复 1：使用 H2 内存数据库。不需要本地或云端安装任何数据库，随启随用，跑完测试内存自动释放。
    # DB_CLOSE_DELAY=-1 保证测试期间数据库不会因为连接断开而重置
    # MODE=PostgreSQL 强迫 H2 模拟 Postgres 的语法特征
    url: jdbc:h2:mem:rentease_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    # 让 Hibernate 使用 H2 的方言
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # 🌟 核心修复 2：在主配置中为了安全不允许自建表，但测试环境必须改为 create-drop
      # 这样 Spring 启动时会自动根据你的 Entity 实体类在内存里建表，测试结束自动删表
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true

  # 🌟 核心修复 3：因为测试环境已经通过 jpa 自动建表，所以务必关闭 Liquibase 迁移，防止版本脚本冲突
  liquibase:
    enabled: false

# 🌟 核心修复 4：虚拟化测试环境的 AWS S3 桶。防止 S3 客户端在云端因为连接不到 localhost:4566 而引发超时闪退
aws:
  region: ap-southeast-2
  s3:
    endpoint: http://localhost:8000 # 随便填一个格式合法的虚拟 Mock 地址即可
    bucket-name: rentease-property-photos-test