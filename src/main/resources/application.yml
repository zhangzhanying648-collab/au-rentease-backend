spring:
  application:
    name: au-rentease-backend

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
    url: jdbc:postgresql://localhost:5432/rentease_db
    username: rentease_admin
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 💡 澳洲大厂生产铁律：坚决不允许使用 update 自建表
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    # 💡 声明主版本控制文件的路径
    change-log: classpath:db/changelog/db.changelog-master.xml
# ==========================================
# 📧 Gmail 核心配置
# ==========================================

  mail:
    host: smtp.gmail.com
    port: 587
    username: zhangzhanying648@gmail.com
    # ⚠️ 注意：这里填写的是你在谷歌账户中生成的 16 位「应用专用密码」
    password: gtbs djez dlqw gshh
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  data:
    redis:
      host: localhost
      port: 6379
      password: 666666
      connect-timeout: 5000ms

    mongodb:
      uri: mongodb://localhost:27017/aurentease

app:
  jwt:
    # 🌟 意思是：优先读取名为 JWT_SECRET 的环境变量，如果系统里没有这个环境变量，就用冒号后面的长字符串
    secret: ${JWT_SECRET:AustraliaBrisbaneGoldCoastMelbourneSydneyPropertyRentEaseSecretKey}
    expiration: 86400000 #24小时的毫秒数

aws:
  region: ap-southeast-2   #悉尼地区
  s3:
    endpoint: http://localhost:4566  #指向本地的Docker沙盒
    bucket-name: rentease-property-photos #我们的专属“桶”名称



logging:
  charset:
    console: UTF-8
  file:
    name: logs/sys.log # 🌟 这样项目运行后会在本地生成 logs 文件夹，从而被 Promtail 捕获
  pattern:
    console: "%d{yyyy-MM-mm HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-mm HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 暴露所有监控端点（包含 prometheus 专用的数据流）
management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    tags:
      application: au-rentease-backend
