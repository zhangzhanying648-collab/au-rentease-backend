#指定了 Docker Compose 文件的版本。3.8 是一个非常稳定且广泛使用的版本，支持绝大多数现代 Docker 特性。
#version: '3.8'

#services 下面定义了你要启动的容器。这里定义了一个名叫 postgres-db 的服务（名字可以自己随便取，代表你的数据库服务）。
services:
  postgres-db:
    #image: 指定使用哪个官方镜像。这里用的是 PostgreSQL 15 版本。
    #后面的 -alpine 是一个关键点——它代表 Alpine Linux 极简操作系统。这意味着这个数据库镜像体积非常小（通常只有几十 MB），
    #启动极快，省内存。
    image: postgres:15-alpine
    #container_name: 给运行起来的容器起一个固定的名字叫 rentease-postgres。
    #如果不写，Docker 会随机生成一个很难记的名字（比如 project_postgres-db_1）。
    container_name: rentease-postgres
    #这是最容易让人混淆的地方，它的格式是 "宿主机端口:容器内端口"。
    #这行配置把容器的 5432 映射到了你真实电脑（宿主机）的 5432 端口。
    #效果： 启动后，你可以在电脑上用连接工具（如 DBeaver、Navicat）
    #或者你的 Spring Boot 代码，直接访问 localhost:5432 就能连上这个容器里的数据库。
    ports:
      - "5432:5432"
    #这是 PostgreSQL 官方镜像预留的初始化参数。当容器第一次启动时，它会自动帮你做好以下初始化工作：
    #
    #创建一个名为 rentease_db 的数据库。
    #
    #创建一个管理员账号，用户名是 rentease_admin。
    #
    #设置该账号的密码为 123456。
    environment:
      POSTGRES_DB: rentease_db
      POSTGRES_USER: rentease_admin
      POSTGRES_PASSWORD: 123456
    #这是最重要的一步。容器的生命周期是短暂的，
    #如果不用 volumes，一旦你关闭或者删除了这个 Docker 容器，你存在数据库里的所有数据都会瞬间灰飞烟灭。
    volumes:
      - pgdata:/var/lib/postgresql/data


  # 澳洲大厂云原生开发标配：LocalStack虚拟AWS沙盒
  localstack:
#    image: localstack/localstack:latest
    # 🌟 核心修复 1：不要用 latest！改成固定的 3.0 版本（或者 3.4.0）
    # 这个版本是纯净的社区免费版，绝不会因为没有 License Token 而无理取闹地闪退
    image: localstack/localstack:3.0
    container_name: rentease-aws-sandbox
    # 💡 针对 Mac M系列芯片增加这行可以大幅提升稳定性（Windows加上也完全无害）
    platform: linux/amd64
    ports:
      - "4566:4566"     # AWS所有服务(S3,SQS,SNS)等统一在这个端口
    # 🌟 修复点：改用干净的冒号键值对，彻底防御注释被误解析的Bug
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-southeast-2 # 贴合澳洲本地，设为悉尼区域
    volumes:
      - localstack:/var/lib/localstack

  # 🚀 大厂完美平替：Docker 官方标准私有镜像仓库 (免费、开源、无限制)
  local-registry:
    image: registry:2
    container_name: rentease-registry
    ports:
      - "5001:5000"            # 💡 将容器内的 5000 端口映射到本地的 5001 端口
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true" # 允许删除镜像
    volumes:
      - registry_data:/var/lib/registry

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: au-rentease-rabbitmq
    ports:
      - "5672:5672"   # 🚀 MQ 核心通信端口（Spring Boot 连接这个端口）
      - "15672:15672" # 📊 Web 管理后台可视化控制台端口
    environment:
      RABBITMQ_DEFAULT_USER: guest     # 初始管理员账号
      RABBITMQ_DEFAULT_PASS: guest     # 初始管理员密码
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # 持久化队列和消息数据，防止容器重启后数据丢失

  redis:
    image: redis:7.2-alpine # 使用轻量且稳定的 alpine 版本
    container_name: rentease-redis # 容器名称，方便识别
    restart: always # 遭遇崩溃或宿主机重启时自动拉起
    ports:
      - "6379:6379" # 映射物理机端口 : 容器内部端口
    volumes:
      - redis_data:/data # 数据持久化挂载，防止容器重启后数据丢失
    command: redis-server --requirepass 666666 --appendonly yes
    # 🌟 核心解释：
    # --requirepass 后面跟你的 Redis 密码（建议改掉 YourSecurePassword123）
    # --appendonly yes 开启 AOF 持久化，数据更安全

  # 🍃 MongoDB 容器服务
  mongodb:
    image: mongo:6.0
    container_name: rentease-mongodb
    restart: always
    ports:
      - "27017:27017" # 映射到你电脑本地的 27017 端口
    environment:
      MONGO_INITDB_DATABASE: aurentease # 初始化的数据库名字
      # 💡 提示：为了本地开发实践方便，这里先不配账号密码（免密登录）。
      # 如果想配密码，可以解开下面两行：
      # MONGO_INITDB_ROOT_USERNAME: admin
      # MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      # 🌟 核心：持久化挂载。把容器内的数据库文件挂载到你电脑本地的 mongo_data 文件夹。
      # 这样哪怕你删了容器，你的房源扩展数据、看房申请日志也绝对不会丢失。
      - mongo_data:/data/db

  # 🛠️ MongoDB 可视化网页控制台（强烈推荐，比单独装客户端方便 100 倍）
  mongo-express:
    image: mongo-express
    container_name: rentease-mongo-ui
    restart: always
    ports:
      - "8081:8081" # 映射到本地 8081 端口
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb # 自动连接上面的 mongodb 服务
      ME_CONFIG_MONGODB_PORT: 27017

volumes:
  pgdata:
  localstack:
  registry_data:
  rabbitmq_data: # 声明数据卷
  redis_data:
  mongo_data:


