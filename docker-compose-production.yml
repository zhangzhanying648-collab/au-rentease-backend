#version: '3.8'

services:
  # 1. 生产级数据库基石
  postgres-db:
    image: postgres:15-alpine
    container_name: rentease-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rentease_db
      POSTGRES_USER: rentease_admin
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rentease-network

  # 2. 生产级 AWS S3 虚拟云
  localstack:
    image: localstack/localstack:3.0
    container_name: rentease-aws-sandbox
    platform: linux/amd64
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-southeast-2
    volumes:
      - localstack:/var/lib/localstack
    networks:
      - rentease-network

  # 🚀 3. 我们的 AU-RentEase 后端核心生产集装箱！
  # 💡 模拟大厂从私有仓库（5001端口）直接拉取镜像部署
#  rentease-backend:
#    image: localhost:5001/au-rentease-backend:v1.0.0
#    container_name: prod-rentease-backend-app
#    ports:
#      - "8080:8080" # 将内部生产端口暴露给你的笔记本电脑
#    restart: always # 💡 避坑：如果数据库没初始化好导致闪退，容器会自动重启直到连上为止
#    depends_on:
#      - postgres-db
#      - localstack
#    networks:
#      - rentease-network
#    # 💡 大厂核心避坑点：通过环境变量（Environment Variables）强行覆盖代码里的配置，完成零重构跨环境部署
#    environment:
#      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rentease_db
#      - SPRING_DATASOURCE_USERNAME=rentease_admin
#      - SPRING_DATASOURCE_PASSWORD=123456
#      - AWS_S3_ENDPOINT=http://localstack:4566 # 💡 强行指向容器网络内部的 localstack 服务
#      - AWS_S3_BUCKET_NAME=rentease-property-photos
#      - AWS_REGION=ap-southeast-2
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: au-rentease-rabbitmq
    ports:
      - "5672:5672"   # 🚀 MQ 核心通信端口（Spring Boot 连接这个端口）
      - "15672:15672" # 📊 Web 管理后台可视化控制台端口
    environment:
      RABBITMQ_DEFAULT_USER: guest     # 初始管理员账号
      RABBITMQ_DEFAULT_PASS: guest     # 初始管理员密码
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # 持久化队列和消息数据，防止容器重启后数据丢失
    networks:
      - rentease-network               # 确保与你的后端 Spring Boot 服务在同一个 Docker 网络下
  redis:
    image: redis:7.2-alpine # 使用轻量且稳定的 alpine 版本
    container_name: rentease-redis # 容器名称，方便识别
    restart: always # 遭遇崩溃或宿主机重启时自动拉起
    ports:
      - "6379:6379" # 映射物理机端口 : 容器内部端口
    volumes:
      - redis_data:/data # 数据持久化挂载，防止容器重启后数据丢失
    command: redis-server --requirepass 666666 --appendonly yes
    # 🌟 核心解释：
    # --requirepass 后面跟你的 Redis 密码（建议改掉 YourSecurePassword123）
    # --appendonly yes 开启 AOF 持久化，数据更安全
  # 🍃 MongoDB 容器服务
  mongodb:
    image: mongo:6.0
    container_name: rentease-mongodb
    restart: always
    ports:
      - "27017:27017" # 映射到你电脑本地的 27017 端口
    environment:
      MONGO_INITDB_DATABASE: aurentease # 初始化的数据库名字
      # 💡 提示：为了本地开发实践方便，这里先不配账号密码（免密登录）。
      # 如果想配密码，可以解开下面两行：
      # MONGO_INITDB_ROOT_USERNAME: admin
      # MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      # 🌟 核心：持久化挂载。把容器内的数据库文件挂载到你电脑本地的 mongo_data 文件夹。
      # 这样哪怕你删了容器，你的房源扩展数据、看房申请日志也绝对不会丢失。
      - mongo_data:/data/db

  # 🛠️ MongoDB 可视化网页控制台（强烈推荐，比单独装客户端方便 100 倍）
  mongo-express:
    image: mongo-express
    container_name: rentease-mongo-ui
    restart: always
    ports:
      - "8081:8081" # 映射到本地 8081 端口
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb # 自动连接上面的 mongodb 服务
      ME_CONFIG_MONGODB_PORT: 27017

  # 📈 1. Prometheus 时序数据库服务
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: rentease-prometheus
    restart: always
    ports:
      - "9090:9090" # 映射到物理机 9090 端口
    volumes:
      # 🛡️ 挂载本地编写的 prometheus.yml 配置文件
      - D:/au_workspace/au-rentease-backend/prometheus.yml:/etc/prometheus/prometheus.yml
      # 时序数据持久化
      - prometheus_data:/prometheus
    networks:
      - rentease-network

  # 📊 2. Grafana 数据可视化面板服务
  grafana:
    image: grafana/grafana:10.2.0
    container_name: rentease-grafana
    restart: always
    ports:
      - "3000:3000" # 映射到本地 3000 端口，用来登录监控大厅
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # 🌟 设置初始化管理员默认密码（账号是 admin）
    volumes:
      # 仪表盘、数据源等配置持久化
      - grafana_data:/var/lib/grafana
    networks:
      - rentease-network
    depends_on:
      - prometheus # 确保 Prometheus 启动后再拉起 Grafana

  # 📂 Loki：日志存储与搜索引擎
  loki:
    image: grafana/loki:2.8.2
    container_name: rentease-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      # 🌟 核心修复 2：把数据持久化，防止重启 Docker 后日志丢失
      - loki_data:/loki
    networks:
      - rentease-network

  # 🚚 Promtail：日志抓取搬运工
  promtail:
    image: grafana/promtail:2.8.2
    container_name: rentease-promtail
    volumes:
      # 🌟 核心：把你电脑本地的日志文件夹挂载进去，让 Promtail 去偷日志
      - ./logs:/var/log/app
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - rentease-network
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: rentease-jaeger
    ports:
      - "16686:16686" # Jaeger Web UI 界面端口
      - "4318:4318"   # 接收 Spring Boot 发射 OTLP 数据的端口
    networks:
      - rentease-network

networks:
  rentease-network: # 💡 建立专属隔离的生产网络，模拟公有云 VPC
    driver: bridge

volumes:
  pgdata:
  localstack:
  rabbitmq_data: # 声明数据卷
  redis_data:
  mongo_data:
  prometheus_data:
  grafana_data:
  loki_data: