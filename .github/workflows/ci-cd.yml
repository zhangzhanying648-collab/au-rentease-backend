name: AU-RentEase Backend CI/CD Pipeline

#触发机制：一旦有开发人员往main分支push代码，或者发起pull request，立刻肉身激活流水线
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# 🌟 核心修复：在这里加上全局环境变量，强迫整个 Runner 所有的 Actions 全部用 Node 24 运行
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    #告诉Github：在云端给我拉起一台最新版的ubuntu虚拟机作为编译环境
    runs-on: ubuntu-latest

    steps:
      #1. 把源码checkout到云端
      - name: Checkout Source Code
        uses: actions/checkout@v4

      #2. 在云端配置java17的运行环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' #开启maven缓存，第二次跑流水线时几秒钟搞定

      #3. 在云端直接调用maven轰炸所有测试
      - name: Run All Junit Tests
        run: mvn test

      #4. 如果测试全部通过，云端启动Docker编译，检测Dockerfile是否完好
      - name: Build Production Docker Image
        run:
          docker build -t au-rentease-backend:latest
          echo "Success! Production Docker Image built and safe to depoly!"



